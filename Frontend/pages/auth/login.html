<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Grades Management Portal</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <!-- Custom Styles -->
    <link href="../../css/styles.css" rel="stylesheet">
</head>
<body>
    <div class="login-page">
        <div class="login-card">
            <div class="login-header">
                <i class="fas fa-graduation-cap fa-3x mb-3"></i>
                <h2>Grades Portal</h2>
                <p>Management System</p>
            </div>

            <div class="login-body">
                <!-- Error Alert Placeholder -->
                <div class="alert alert-danger alert-dismissible fade show" role="alert" id="error-alert" style="display: none;">
                    <i class="fas fa-exclamation-circle me-2"></i>
                    <span id="error-message">Invalid username or password. Please try again.</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <!-- Success Alert Placeholder -->
                <div class="alert alert-success alert-dismissible fade show" role="alert" id="success-alert" style="display: none;">
                    <i class="fas fa-check-circle me-2"></i>
                    <span id="success-message">Login successful! Redirecting...</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <form id="login-form" method="POST">
                    <!-- Username Input -->
                    <div class="mb-3">
                        <label for="username" class="form-label">
                            <i class="fas fa-user me-1"></i> Username / ID / Email
                        </label>
                        <input type="text" class="form-control" id="username" name="username"
                               placeholder="Enter your username, ID, or email" required autofocus>
                    </div>

                    <!-- Password Input -->
                    <div class="mb-4">
                        <label for="password" class="form-label">
                            <i class="fas fa-lock me-1"></i> Password
                        </label>
                        <div class="password-wrapper">
                            <input type="password" class="form-control" id="password" name="password"
                                   placeholder="Enter your password" required>
                            <button type="button" class="password-toggle" title="Show/Hide Password">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Remember Me & Forgot Password -->
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="remember-me" name="remember">
                            <label class="form-check-label" for="remember-me">
                                Remember me
                            </label>
                        </div>
                        <a href="forgot-password.html" class="text-decoration-none">Forgot Password?</a>
                    </div>

                    <!-- Login Button -->
                    <button type="submit" class="btn btn-primary login-btn">
                        <i class="fas fa-sign-in-alt me-2"></i> Login
                    </button>
                </form>

                <!-- Footer Link -->
                <div class="text-center mt-4">
                    <p class="text-muted mb-0">
                        Need help? <a href="support.html" class="text-decoration-none">Contact Support</a>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JavaScript -->
    <script src="../../js/main.js"></script>

    <!-- Login Page Specific Script -->
    <script>
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorAlert = document.getElementById('error-alert');
            const successAlert = document.getElementById('success-alert');

            // Hide any existing alerts
            errorAlert.style.display = 'none';
            successAlert.style.display = 'none';

            // Submit to backend via AJAX
            const formData = new FormData();
            formData.append('login', '1');
            formData.append('username', username);
            formData.append('password', password);

            fetch('../../../backend/login.php', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    // Show success message
                    document.getElementById('success-message').textContent = data.message;
                    successAlert.style.display = 'block';

                    // Store user info in sessionStorage
                    sessionStorage.setItem('user', JSON.stringify(data.user));

                    // Redirect after short delay
                    setTimeout(function() {
                        window.location.href = data.redirect;
                    }, 1000);
                } else {
                    // Show error message
                    document.getElementById('error-message').textContent = data.message;
                    errorAlert.style.display = 'block';
                }
            })
            .catch(error => {
                console.error('Login error:', error);
                document.getElementById('error-message').textContent = 'Connection error. Please check your server.';
                errorAlert.style.display = 'block';
            });
        });
    </script>
</body>
</html>
